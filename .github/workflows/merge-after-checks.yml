name: Merge PR after verified checks

# A trusted workflow: never checks out or executes PR code with write permissions.
# Runs after both CI and CodeQL complete; the last successful workflow run
# will merge only if every expected job for the exact PR head SHA succeeded.
on:
  workflow_run:
    workflows: ["CI", "CodeQL"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  merge:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge same-repository PR when all checks pass
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const expected = [
              'Site checks and browser tests',
              'Docker Compose environment',
              'Wallet SQL integration',
              'Mad Mallard standards',
              'Analyze JavaScript and TypeScript'
            ];
            // Only repository-owned branches. Never execute code from a PR here.
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            for (const pr of prs) {
              if (pr.draft || pr.head.repo?.full_name !== `${owner}/${repo}` ||
                  pr.head.sha !== run.head_sha) continue;
              // A successful CodeQL workflow can finish before a failing CI workflow.
              // Require BOTH workflow conclusions for the same immutable PR head SHA.
              const runsResponse = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, event: 'pull_request', head_sha: pr.head.sha, per_page: 100
              });
              const latestRuns = new Map();
              for (const result of runsResponse.data.workflow_runs || []) {
                if (!['CI', 'CodeQL'].includes(result.name)) continue;
                const previous = latestRuns.get(result.name);
                if (!previous || new Date(result.created_at) > new Date(previous.created_at)) {
                  latestRuns.set(result.name, result);
                }
              }
              const pendingWorkflows = ['CI', 'CodeQL'].filter(name => {
                const result = latestRuns.get(name);
                return result?.status !== 'completed' || result.conclusion !== 'success';
              });
              if (pendingWorkflows.length) {
                core.info(`PR #${pr.number}: workflows not successful: ${pendingWorkflows.join(', ')}`);
                continue;
              }
              // The checks endpoint's response is an object with check_runs; do
              // not use a pagination map that can produce undefined entries.
              const checks = [];
              for (let page = 1; page <= 5; page++) {
                const result = await github.rest.checks.listForRef({
                  owner, repo, ref: pr.head.sha, per_page: 100, page
                });
                const batch = Array.isArray(result.data) ? result.data : (result.data.check_runs || []);
                checks.push(...batch);
                if (batch.length < 100) break;
              }
              const latest = new Map();
              for (const check of checks) {
                if (!check || check.app?.slug !== 'github-actions') continue;
                const previous = latest.get(check.name);
                if (!previous || new Date(check.started_at || 0) > new Date(previous.started_at || 0)) {
                  latest.set(check.name, check);
                }
              }
              const missing = expected.filter(name => latest.get(name)?.conclusion !== 'success');
              if (missing.length) {
                core.info(`PR #${pr.number}: waiting for successful checks: ${missing.join(', ')}`);
                continue;
              }
              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: pr.number,
                  sha: pr.head.sha, merge_method: 'squash'
                });
                core.info(`Merged PR #${pr.number} after all required checks passed.`);
              } catch (error) {
                // Branch protections and conflicts are authoritative. Do not bypass.
                core.warning(`PR #${pr.number} was not merged: ${error.message}`);
              }
            }
