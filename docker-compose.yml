# Local test environment, reachable from other devices on your network (phones, tablets).
#   docker compose up -d                      → http://<this-computer's-LAN-IP>:8080
#   docker compose --profile test run --rm tests   → browser tests against that server
services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "${QA_PORT:-8080}:80"           # binds all interfaces, so the LAN can reach it
    volumes:
      - ./:/usr/share/nginx/html:ro     # edits show up on refresh, no rebuild
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  tests:
    profiles: ["test"]
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /work
    volumes:
      - ./:/work
      - /work/node_modules
    environment:
      BASE_URL: http://web/
      CI: "1"
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"
    depends_on:
      web:
        condition: service_healthy
